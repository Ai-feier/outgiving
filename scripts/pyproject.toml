[project]
name = "content"
version = "0.1.0"
description = "多渠道内容创作数据管理引擎"
authors = [{ name = "mkt", email = "k2664586998@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.2",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "markdown-it-py>=4.2.0",
    "volcengine-python-sdk[ark,visual]>=5.0.41",
    "curl-cffi>=0.15.0",
    "ffmpeg-python>=0.2",
    "pillow>=10.0",
]

[project.scripts]
content = "content.cli:main"
web-fetcher = "web_fetcher.__main__:cli"
ai = "ai.cli:cli"
stock = "stock_finder.cli:cli"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: editor 端到端渲染测试（重 ffmpeg，显式 `pytest -m e2e` 才跑）",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["pytest>=8.0"]
