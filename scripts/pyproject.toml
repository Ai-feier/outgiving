[project]
name = "content"
version = "0.1.0"
description = "多平台内容创作数据管理引擎"
authors = [{ name = "mkt", email = "k2664586998@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.2",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "markdown-it-py>=4.2.0",
    "volcengine-python-sdk[ark,visual]>=5.0.41",
]

[project.scripts]
content = "content.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"
